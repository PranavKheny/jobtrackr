services:
  - type: web
    name: jobtrackr-api
    env: node
    plan: free
    buildCommand: 'npm install && npm run build --workspace=api'
    startCommand: 'npm run start --workspace=api'
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobtrackr-db
          property: connectionString
      - key: WEB_APP_URL
        value: https://your-webapp-url.com # Replace with your frontend URL
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: DEMO_MODE
        value: 'false'

  - type: pserv
    name: jobtrackr-db
    env: postgres
    plan: free
    postgres:
      version: 13
